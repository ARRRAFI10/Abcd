databases:
  - name: arrrafi10-moon-shop-db
    databaseName: moonshop
    user: moonshop
    plan: free

services:
  - type: web
    name: arrrafi10-moon-shop-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python manage.py bootstrap_catalog && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /api/products/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arrrafi10-moon-shop-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SERVE_MEDIA
        value: "1"
      - key: DJANGO_INITIAL_ADMIN_PASSWORD
        sync: false
